services:
  listaecompra:
    image: postgres:16
    container_name: listaecompra
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_DB}
    ports:
      - '${DATABASE_PORT}:5432'

    volumes:
      - taskflow_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: listaecompra-redis
    ports:
      - '6379:6379'

volumes:
  taskflow_data:
